<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生沙盘 · 推演模拟器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: #080b16;
    color: #e8ecf8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px 80px;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(109,140,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(244,114,182,0.10), transparent 45%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 720px; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeUp .45s cubic-bezier(.22,1,.36,1); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* 开始页 */
  .start-card { text-align: center; padding: 48px 12px 0; }
  .title {
    font-size: clamp(34px, 8vw, 46px); font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(135deg, #8ba4ff 0%, #c4a3ff 50%, #f472b6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.25;
  }
  .subtitle { margin-top: 14px; font-size: 14px; color: #7c87a8; letter-spacing: .5px; }
  .intro {
    margin: 34px auto 0; max-width: 480px; text-align: left;
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 22px 24px; font-size: 14px; line-height: 1.9; color: #a8b2ce;
  }
  .intro b { color: #dbe3ff; font-weight: 600; }
  .intro .hl { color: #8ba4ff; }
  .btn-primary {
    display: inline-block; margin-top: 32px; padding: 15px 52px; font-size: 16px; font-weight: 600;
    letter-spacing: 2px; color: #fff; background: linear-gradient(135deg, #5b7cfa, #8b5cf6);
    border: none; border-radius: 999px; cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 30px -8px rgba(109,140,255,.7); transition: transform .2s, box-shadow .2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -10px rgba(109,140,255,.85); }
  .btn-primary:active { transform: translateY(0); }

  /* 次级按钮（分享） */
  .btn-secondary {
    display: inline-block; padding: 13px 32px; font-size: 14px; font-weight: 600;
    color: #8ba4ff; background: rgba(109,140,255,0.1); border: 1px solid rgba(109,140,255,0.3);
    border-radius: 999px; cursor: pointer; font-family: inherit; margin-left: 10px;
    transition: all .2s;
  }
  .btn-secondary:hover { background: rgba(109,140,255,0.2); color: #fff; }

  /* 选择页共用 */
  .section-title { font-size: 13px; letter-spacing: 3px; color: #6d7899; text-align: center; margin-bottom: 8px; }
  .section-heading { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 26px; }

  /* 性别选择 */
  .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 440px; margin: 0 auto; }
  .gender-card {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px; padding: 36px 20px; text-align: center; cursor: pointer;
    transition: .22s cubic-bezier(.22,1,.36,1); color: inherit; font-family: inherit;
  }
  .gender-card:hover { background: rgba(109,140,255,0.12); border-color: rgba(109,140,255,0.55); transform: translateY(-4px); }
  .gender-icon { font-size: 44px; margin-bottom: 12px; }
  .gender-name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .gender-desc { font-size: 12px; color: #7c87a8; line-height: 1.5; }

  /* 出身选择 */
  .origin-grid { display: grid; gap: 12px; }
  .origin-card {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 15px; padding: 17px 20px; text-align: left; cursor: pointer;
    transition: .22s cubic-bezier(.22,1,.36,1); color: inherit; width: 100%; font-family: inherit;
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
  }
  .origin-card:hover { background: rgba(109,140,255,0.12); border-color: rgba(109,140,255,0.55); transform: translateY(-2px); }
  .origin-name { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
  .origin-desc { font-size: 12.5px; color: #7c87a8; line-height: 1.5; }
  .origin-preview { display: flex; gap: 4px; flex-shrink: 0; }
  .op-dot { width: 7px; height: 22px; border-radius: 4px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; }
  .op-dot i { position: absolute; bottom: 0; left: 0; width: 100%; border-radius: 4px; }

  /* 游戏 HUD */
  .hud {
    display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 18px; margin-bottom: 18px;
    backdrop-filter: blur(12px); position: sticky; top: 12px; z-index: 10;
  }
  .age-block { display: flex; align-items: baseline; gap: 3px; flex-shrink: 0; }
  .age-num {
    font-size: 26px; font-weight: 800;
    background: linear-gradient(135deg, #8ba4ff, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums;
  }
  .age-unit { font-size: 12px; color: #6d7899; }
  .attrs { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .attr { min-width: 0; }
  .attr-top { display: flex; align-items: center; justify-content: space-between; gap: 3px; margin-bottom: 4px; }
  .attr-icon { font-size: 11px; opacity: .85; }
  .attr-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 3px; background: rgba(255,255,255,0.09); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; transition: width .55s cubic-bezier(.22,1,.36,1); }

  /* 事件区 */
  .event-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .age-tag {
    font-size: 11.5px; font-weight: 600; letter-spacing: 1px; color: #8ba4ff;
    background: rgba(109,140,255,0.14); border: 1px solid rgba(109,140,255,0.3); padding: 4px 11px; border-radius: 999px;
  }
  .step { font-size: 11.5px; color: #5c6684; letter-spacing: .5px; }
  .event-title { font-size: 25px; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; line-height: 1.35; }
  .event-text { font-size: 14.5px; line-height: 1.85; color: #98a3c2; margin-bottom: 26px; }

  .choices { display: grid; gap: 11px; }
  .choice {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; text-align: left; color: inherit; font-family: inherit; width: 100%;
    transition: .2s cubic-bezier(.22,1,.36,1);
  }
  .choice:hover { background: rgba(109,140,255,0.13); border-color: rgba(109,140,255,0.55); transform: translateX(4px); }
  .choice-title { font-size: 15.5px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
  .choice-sub { font-size: 12.5px; color: #7c87a8; line-height: 1.5; }
  .choice-risk { text-align: right; flex-shrink: 0; }
  .dots { display: block; font-size: 9px; letter-spacing: 2px; color: #f472b6; margin-bottom: 3px; }
  .risk-label { font-size: 10.5px; color: #6d7899; white-space: nowrap; }

  /* 结果展示 */
  .outcome {
    background: linear-gradient(160deg, rgba(109,140,255,0.10), rgba(244,114,182,0.05));
    border: 1px solid rgba(109,140,255,0.28); border-radius: 18px; padding: 28px 26px;
    animation: fadeUp .45s cubic-bezier(.22,1,.36,1);
  }
  .outcome-label { font-size: 11px; letter-spacing: 4px; color: #8ba4ff; margin-bottom: 16px; font-weight: 600; }
  .outcome-text { font-size: 15.5px; line-height: 1.9; color: #dfe6ff; margin-bottom: 22px; }
  .deltas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .delta { font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .delta.up   { color: #4ade80; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.28); }
  .delta.down { color: #fb7185; background: rgba(251,113,133,0.12); border: 1px solid rgba(251,113,133,0.28); }
  .outcome .btn-primary { margin-top: 0; padding: 13px 40px; font-size: 14.5px; }

  /* 结局报告 */
  .end-head { text-align: center; padding: 16px 0 8px; }
  .end-label { font-size: 12px; letter-spacing: 5px; color: #6d7899; margin-bottom: 16px; }
  .score {
    font-size: 68px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #8ba4ff, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums;
  }
  .score-unit { font-size: 14px; color: #6d7899; margin-left: 4px; }
  .rank-name { font-size: 24px; font-weight: 700; margin-top: 14px; letter-spacing: 2px; }
  .rank-desc { font-size: 13.5px; color: #8b95b5; margin-top: 9px; line-height: 1.7; }
  .lifespan-tag {
    display: inline-block; margin-top: 12px; font-size: 12px; color: #f0abfc;
    background: rgba(244,114,182,0.12); border: 1px solid rgba(244,114,182,0.3);
    padding: 5px 14px; border-radius: 999px; letter-spacing: 1px;
  }

  .panel { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 24px 22px; margin-top: 18px; }
  .panel-title { font-size: 12.5px; letter-spacing: 3px; color: #8ba4ff; font-weight: 600; margin-bottom: 20px; }

  /* 人物画像专属样式 & 头像 */
  .persona-box {
    background: linear-gradient(135deg, rgba(109,140,255,0.1), rgba(244,114,182,0.05));
    border: 1px dashed rgba(109,140,255,0.4);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 16px; }
  .avatar-circle {
    width: 100px; height: 100px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 52px; 
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.4);
    position: relative; z-index: 2; transition: all 0.5s ease;
  }
  .avatar-wrapper.high-score .avatar-circle {
    box-shadow: 0 0 25px rgba(244,114,182,0.6), inset 0 0 20px rgba(0,0,0,0.5);
    border: 3px solid #f472b6;
  }
  .avatar-wrapper.low-score .avatar-circle {
    filter: grayscale(80%); border: 3px solid #6d7899;
  }
  .avatar-accessory { position: absolute; font-size: 24px; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .acc-crown { top: -16px; left: 50%; transform: translateX(-50%) rotate(-10deg); }
  .acc-bandage { bottom: -5px; right: -5px; transform: rotate(15deg); }
  .acc-tag { top: 0; right: -10px; font-size: 28px; }
  .acc-sweat { top: 10px; right: -5px; font-size: 22px; }
  .acc-cloud { bottom: -10px; left: -10px; font-size: 28px; }

  .persona-tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .persona-tag {
    font-size: 12px; font-weight: 600; color: #fff;
    background: rgba(109,140,255,0.25); border: 1px solid rgba(109,140,255,0.5);
    padding: 5px 12px; border-radius: 8px;
  }
  .persona-tag.negative { background: rgba(251,113,133,0.15); border-color: rgba(251,113,133,0.4); color: #fb7185; }
  .persona-text { font-size: 14.5px; line-height: 1.85; color: #dfe6ff; text-align: left; }
  .persona-epitaph {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; color: #8ba4ff; font-style: italic; font-weight: 500; text-align: center;
  }

  .radar-wrap { display: flex; justify-content: center; }
  .radar { width: 100%; max-width: 330px; height: auto; }

  .attr-rows { display: grid; gap: 15px; }
  .attr-row { display: flex; align-items: center; gap: 12px; }
  .ar-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
  .ar-body { flex: 1; min-width: 0; }
  .ar-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .ar-name { font-size: 13px; color: #b8c2dd; font-weight: 600; }
  .ar-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ar-bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .ar-bar i { display: block; height: 100%; border-radius: 4px; transition: width .8s cubic-bezier(.22,1,.36,1); }
  .ar-comment { font-size: 11.5px; color: #6d7899; margin-top: 5px; }

  .review-list { display: grid; gap: 14px; }
  .review-item { border-left: 2px solid rgba(109,140,255,0.4); padding-left: 14px; }
  .review-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .review-age { font-size: 11px; color: #8ba4ff; font-weight: 700; }
  .review-title { font-size: 12.5px; color: #7c87a8; }
  .review-choice { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.5; }
  .review-deltas { display: flex; flex-wrap: wrap; gap: 6px; }
  .review-deltas .delta { font-size: 11px; padding: 3px 9px; }

  .alt-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 14px 16px; margin-bottom: 11px; }
  .alt-item:last-child { margin-bottom: 0; }
  .alt-head { font-size: 11.5px; color: #8ba4ff; font-weight: 600; margin-bottom: 7px; }
  .alt-path { font-size: 13.5px; font-weight: 600; color: #dfe6ff; margin-bottom: 5px; }
  .alt-text { font-size: 12.5px; line-height: 1.7; color: #7c87a8; }

  .end-actions { text-align: center; margin-top: 26px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(74,222,128,0.9); color: #080b16; padding: 12px 24px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s; z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px) {
    body { padding: 14px 12px 70px; }
    .hud { flex-direction: column; align-items: stretch; gap: 11px; padding: 13px 15px; }
    .age-block { justify-content: center; }
    .attrs { gap: 8px; }
    .attr-val { font-size: 11px; }
    .event-title { font-size: 21px; }
    .choice { padding: 14px 15px; gap: 10px; }
    .choice-title { font-size: 14.5px; }
    .choice-sub { font-size: 11.5px; }
    .outcome { padding: 22px 18px; }
    .score { font-size: 56px; }
    .btn-secondary { margin-left: 0; margin-top: 12px; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="screen active" id="screen-start">
    <div class="start-card">
      <div class="title">人生沙盘</div>
      <div class="subtitle">LIFE SANDBOX · 决策推演模拟器</div>
      <div class="intro">
        你即将走过一段<b>浓缩的人生</b>，从 18 岁到 100 岁，经历 20 次重大抉择。<br><br>
        每一个选择都<b>没有标准答案</b>，只有代价与收获的不同分配。<br><br>
        这不是预言，而是一次<span class="hl">低成本的试错</span>——先在这里看清可能的后果，再去面对真实的人生。
      </div>
      <button class="btn-primary" id="btn-start">开始推演</button>
    </div>
  </div>

  <div class="screen" id="screen-gender">
    <div class="section-title">STEP 01</div>
    <div class="section-heading">你的生理性别是？</div>
    <div class="gender-grid">
      <button class="gender-card" data-gender="male">
        <div class="gender-icon">👨</div>
        <div class="gender-name">男性</div>
        <div class="gender-desc">社会往往期待你坚强、扛事，你面临的是养家与事业的压力。</div>
      </button>
      <button class="gender-card" data-gender="female">
        <div class="gender-icon">👩</div>
        <div class="gender-name">女性</div>
        <div class="gender-desc">你要面对职场天花板与生育代价，但也可能拥有更细腻的情感支撑。</div>
      </button>
    </div>
  </div>

  <div class="screen" id="screen-origin">
    <div class="section-title">STEP 02</div>
    <div class="section-heading">你从什么样的起点出发？</div>
    <div class="origin-grid" id="origin-grid"></div>
  </div>

  <div class="screen" id="screen-game">
    <header class="hud" id="hud"></header>
    <main id="stage"></main>
  </div>

  <div class="screen" id="screen-end">
    <div id="end-content"></div>
  </div>

</div>
<div id="toast" class="toast">文案已复制，快去分享吧！</div>

<script>
/* =========================================================
   数据层
   ========================================================= */

const ATTR_KEYS = ['health', 'wealth', 'happiness', 'relations', 'growth'];

const ATTR_META = {
  health:    { name: '健康', color: '#34d399', icon: '❤️' },
  wealth:    { name: '财富', color: '#fbbf24', icon: '💰' },
  happiness: { name: '幸福', color: '#f472b6', icon: '😊' },
  relations: { name: '关系', color: '#60a5fa', icon: '🤝' },
  growth:    { name: '成长', color: '#a78bfa', icon: '🌱' },
};

const SCALE = 0.8;

const ORIGINS = [
  { name: '普通工薪家庭', desc: '父母勤恳，不富裕也不缺，一切靠自己', attrs: { health: 60, wealth: 45, happiness: 55, relations: 55, growth: 55 } },
  { name: '殷实之家', desc: '资源充足，但你也背着父母的期待', attrs: { health: 60, wealth: 75, happiness: 50, relations: 60, growth: 45 } },
  { name: '寒门子弟', desc: '起点低，但你能吃苦，更懂生存', attrs: { health: 65, wealth: 25, happiness: 50, relations: 50, growth: 70 } },
  { name: '自由派家庭', desc: '父母开明，家里没什么钱，但有爱', attrs: { health: 60, wealth: 35, happiness: 70, relations: 65, growth: 55 } },
];

const EVENTS = [
  { age: 18, title: '志愿填报', maleText: '分数已经定了。作为男生，家里期待你选个“好就业”的专业，早点扛起责任。', femaleText: '分数已经定了。长辈常说“女孩子找个稳定点的工作就好”，但你心里有别的想法。', choices: [
      { title: '冲刺名校热门专业', sub: '计算机 / 金融，卷，但天花板高', risk: 3, outcomes: [
          { p: 0.6, t: '你压线录取。名校光环加上硬核专业，实习机会源源不断，代价是几乎没有喘息的时间。', e: { wealth: 8, growth: 12, relations: 8, health: -6, happiness: 2 } },
          { p: 0.4, t: '你被调剂到冷门专业。平台还在，但你得靠自己找方向，深夜里常怀疑这四年到底值不值。', e: { growth: 7, relations: 5, happiness: -6, health: -3 } }
      ]},
      { title: '稳妥本地院校，选喜欢的专业', sub: '离家近，节奏可控', risk: 1, outcomes: [
          { p: 0.75, t: '顺利录取。课业不重，你有时间做社团、交朋友，日子过得松弛而踏实。', e: { happiness: 10, growth: 5, relations: 7, wealth: 2 } },
          { p: 0.25, t: '专业遇冷，就业面偏窄。你开始用课余时间补技能，好在心态还稳。', e: { happiness: 3, growth: 4, wealth: -3 } }
      ]},
      { title: '追随热爱，读艺术 / 人文', sub: '不一定赚钱，但可能更像自己', risk: 3, outcomes: [
          { p: 0.5, t: '热爱撑住了四年。你的作品集和见识远超同龄人，只是账户余额一直很诚实地提醒你。', e: { happiness: 15, growth: 10, wealth: -7, relations: 4 } },
          { p: 0.5, t: '毕业时现实扑面而来。你开始怀疑热爱能否养活自己，焦虑感逐年上升。', e: { happiness: -6, growth: 6, wealth: -9, health: -3 } }

const S = { attrs: {}, age: 18, idx: 0, gender: 'male', history: [], finalScore: 0, finalRank: '', tags: '' };
const $ = id => document.getElementById(id);

// 在这里替换成你最终确定的网页分享链接
const SHARE_URL = 'https://ellieliang.github.io/youcanlivemorethanonce/'; 

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.gender-card').forEach(btn => {
  btn.addEventListener('click', () => {
    S.gender = btn.dataset.gender;
    renderOrigins();
    showScreen('screen-origin');
  });
});

function renderOrigins() {
  const grid = $('origin-grid');
  grid.innerHTML = ORIGINS.map((o, i) => `
    <button class="origin-card" data-i="${i}">
      <div>
        <div class="origin-name">${o.name}</div>
        <div class="origin-desc">${o.desc}</div>
      </div>
      <div class="origin-preview">
        ${ATTR_KEYS.map(k => `
          <div class="op-dot"><i style="height:${o.attrs[k]}%;background:${ATTR_META[k].color}"></i></div>
        `).join('')}
      </div>
    </button>
  `).join('');

  grid.querySelectorAll('.origin-card').forEach(btn => {
    btn.addEventListener('click', () => {
      startGame(ORIGINS[parseInt(btn.dataset.i)]);
    });
  });
}

function startGame(origin) {
  S.attrs = { ...origin.attrs };
  S.idx = 0;
  S.history = [];
  S.age = EVENTS[0].age;
  showScreen('screen-game');
  renderEvent();
}

function renderHUD() {
  const gIcon = S.gender === 'male' ? '👨' : '👩';
  $('hud').innerHTML = `
    <div class="age-block">
      <span style="font-size:20px; margin-right:4px" title="${S.gender === 'male' ? '男性' : '女性'}">${gIcon}</span>
      <span class="age-num">${S.age}</span><span class="age-unit">岁</span>
    </div>
    <div class="attrs">
      ${ATTR_KEYS.map(k => {
        const m = ATTR_META[k], v = S.attrs[k];
        return `
          <div class="attr">
            <div class="attr-top">
              <span class="attr-icon">${m.icon}</span>
              <span class="attr-val" style="color:${m.color}">${Math.round(v)}</span>
            </div>
            <div class="bar"><i style="width:${v}%;background:${m.color}"></i></div>
          </div>`;
      }).join('')}
    </div>
  `;
}

function renderEvent() {
  const ev = EVENTS[S.idx];
  S.age = ev.age;
  renderHUD();

  let displayText = ev.text;
  if (S.gender === 'male' && ev.maleText) displayText = ev.maleText;
  if (S.gender === 'female' && ev.femaleText) displayText = ev.femaleText;

  const stage = $('stage');
  stage.innerHTML = `
    <div class="event">
      <div class="event-meta">
        <span class="age-tag">${ev.age} 岁</span>
        <span class="step">第 ${S.idx + 1} / ${EVENTS.length} 次抉择</span>
      </div>
      <h2 class="event-title">${ev.title}</h2>
      <p class="event-text">${displayText}</p>
      <div class="choices">
        ${ev.choices.map((c, i) => `
          <button class="choice" data-i="${i}">
            <div class="choice-main">
              <div class="choice-title">${c.title}</div>
              <div class="choice-sub">${c.sub}</div>
            </div>
            <div class="choice-risk">
              <span class="dots">${'●'.repeat(c.risk)}${'○'.repeat(3 - c.risk)}</span>
              <span class="risk-label">${['', '低风险', '中风险', '高风险'][c.risk]}</span>
            </div>
          </button>
        `).join('')}
      </div>
    </div>
  `;

  stage.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => choose(parseInt(btn.dataset.i)));
  });
}

function choose(choiceIndex) {
  const ev = EVENTS[S.idx];
  const choice = ev.choices[choiceIndex];

  const roll = Math.random();
  let acc = 0;
  let outcome = choice.outcomes[choice.outcomes.length - 1];
  for (const o of choice.outcomes) {
    acc += o.p;
    if (roll < acc) { outcome = o; break; }
  }

  const deltas = applyEffects(outcome.e);
  S.history.push({ age: ev.age, title: ev.title, choice: choice.title, outcome: outcome.t, deltas, evIndex: S.idx, choiceIndex });
  showOutcome(outcome, deltas);
}

function applyEffects(effects) {
  const deltas = {};
  for (const k of ATTR_KEYS) {
    const raw = effects[k] || 0;
    const d = Math.round(raw * SCALE);
    const before = S.attrs[k];
    S.attrs[k] = Math.max(0, Math.min(100, before + d));
    deltas[k] = Math.round(S.attrs[k] - before);
  }
  return deltas;
}

function showOutcome(outcome, deltas) {
  renderHUD();
  const isLast = S.idx >= EVENTS.length - 1;

  const deltaHTML = ATTR_KEYS
    .filter(k => deltas[k] !== 0)
    .map(k => {
      const d = deltas[k], m = ATTR_META[k];
      return `<span class="delta ${d > 0 ? 'up' : 'down'}">${m.icon} ${m.name} ${d > 0 ? '+' : ''}${d}</span>`;
    }).join('');

  $('stage').innerHTML = `
    <div class="outcome">
      <div class="outcome-label">推演结果</div>
      <p class="outcome-text">${outcome.t}</p>
      <div class="deltas">${deltaHTML || '<span class="delta up">状态无明显变化</span>'}</div>
      <button class="btn-primary" id="next-btn">${isLast ? '查看人生报告 →' : '继续 →'}</button>
    </div>
  `;

  $('next-btn').addEventListener('click', () => {
    if (isLast) showEnd();
    else { S.idx++; renderEvent(); }
  });
}

   结局计算与展示
   ========================================================= */

function calcScore() {
  const a = S.attrs;
  let baseScore = (a.health * 0.20 + a.wealth * 0.15 + a.happiness * 0.25 + a.relations * 0.20 + a.growth * 0.20);

  let bonus = 0;
  if (a.health >= 85) bonus += 3;
  if (a.wealth >= 85) bonus += 3;
  if (a.happiness >= 85) bonus += 4; 
  if (a.relations >= 85) bonus += 3;
  if (a.growth >= 85) bonus += 3;
  if (S.idx >= 19) bonus += 5; 

  return Math.min(100, Math.round(baseScore + bonus));
}

function getRank(score) {
  if (score >= 90) return { name: '传奇人生', desc: '万里挑一的剧本。你不仅赢了，而且赢得漂亮，活成了别人眼里的光。' };
  if (score >= 75) return { name: '圆满人生', desc: '你几乎踩中了每一个关键节点，也守住了真正重要的东西，没什么大遗憾。' };
  if (score >= 60) return { name: '丰盛人生', desc: '有得有失，但你整体活得通透且漂亮，在几个领域达到了极高的上限。' };
  if (score >= 45) return { name: '安稳人生', desc: '没有大起大落，日子过得踏实。也许偶尔会想"如果当初"，但这就是真实的生活。' };
  if (score >= 30) return { name: '起伏人生', desc: '你付出了代价，也换回了一些东西。你在风浪里摸爬滚打，已经是自己的英雄。' };
  return { name: '艰难人生', desc: '很多选择都不在你掌控之内，你一直在用有限的牌打一手硬仗。辛苦了。' };
}

function generatePersona(attrs, score) {
  const arr = ATTR_KEYS.map(k => ({ k, v: Math.round(attrs[k]) }));
  arr.sort((a, b) => b.v - a.v);
  const highest = arr[0];
  const lowest = arr[arr.length - 1];

  let baseAvatar = S.gender === 'male' ? '👨' : '👩';
  let accTag = '';
  let bgGradient = '';
  if (highest.k === 'wealth') { accTag = '💰'; bgGradient = 'linear-gradient(135deg, #fef08a, #f59e0b)'; }
  if (highest.k === 'health') { accTag = '🏃'; bgGradient = 'linear-gradient(135deg, #a7f3d0, #059669)'; }
  if (highest.k === 'happiness') { accTag = '🌻'; bgGradient = 'linear-gradient(135deg, #fbcfe8, #db2777)'; }
  if (highest.k === 'relations') { accTag = '🤝'; bgGradient = 'linear-gradient(135deg, #bfdbfe, #2563eb)'; }
  if (highest.k === 'growth') { accTag = '📚'; bgGradient = 'linear-gradient(135deg, #ddd6fe, #7c3aed)'; }
  
  let accPain = '';
  if (lowest.k === 'health') accPain = `<div class="avatar-accessory acc-sweat">💧</div>`;
  if (lowest.k === 'wealth') accPain = `<div class="avatar-accessory acc-sweat">🪙</div>`;
  if (lowest.k === 'happiness') accPain = `<div class="avatar-accessory acc-cloud">☁️</div>`;
  if (lowest.k === 'relations') accPain = `<div class="avatar-accessory acc-cloud">🌧️</div>`;
  if (lowest.k === 'growth') accPain = `<div class="avatar-accessory acc-sweat">💤</div>`;

  let crown = '';
  let scoreClass = '';
  if (score >= 75) {
    crown = `<div class="avatar-accessory acc-crown">👑</div>`;
    scoreClass = 'high-score';
  } else if (score < 45) {
    crown = `<div class="avatar-accessory acc-bandage">🩹</div>`;
    scoreClass = 'low-score';
  }

  const tags = {
    high: { health: '硬核养生', wealth: '世俗赢家', happiness: '浪漫主义', relations: '人情枢纽', growth: '终身学徒' },
    low: { health: '透支者', wealth: '清贫者', happiness: '内耗者', relations: '孤岛客', growth: '守成者' }
  };
  let mainTag = tags.high[highest.k];
  let negativeTag = lowest.k !== highest.k ? tags.low[lowest.k] : '';
  let tagHTML = `<span class="persona-tag">${mainTag}</span>`;
  if (negativeTag) tagHTML += `<span class="persona-tag negative">${negativeTag}</span>`;
  if (score >= 75) tagHTML += `<span class="persona-tag" style="background:rgba(244,114,182,0.3);border-color:#f472b6">人生赢家</span>`;
  S.tags = mainTag + (negativeTag ? ' / ' + negativeTag : '');

  const highDesc = {
    health: '你把身体当成了最忠实的本钱，活得久且硬朗；',
    wealth: '你深谙财富的游戏规则，在物质上获得了极大的自由；',
    happiness: '你总能在裂缝里种出花来，取悦自己是你一生的必修课；',
    relations: '你身边永远不缺温暖与支持，人情练达，被爱包围；',
    growth: '你的一生都在不断打破认知边界，灵魂始终在路上；'
  }[highest.k];

  const lowDesc = {
    health: '但代价是，你的身体默默替你抗下了所有的透支。',
    wealth: '不过，你对数字似乎并不敏感，没攒下什么大钱。',
    happiness: '只是在无人的深夜，你常常需要独自消化巨大的内耗。',
    relations: '只是你习惯了独来独往，很多时候只能自己撑起一切。',
    growth: '只是你偏爱安稳，渐渐不再向往远方的喧嚣。'
  }[lowest.k];

  let midDesc = '';
  if (score >= 75) midDesc = '这无疑是一份极其令人羡慕的答卷，你平衡得极好。';
  else if (score >= 60) midDesc = '总体来说，你抓住了自己最想要的东西，过得还算如意。';
  else if (score >= 45) midDesc = '你的人生充满了妥协与交换，这就是大多数普通人的真实写照。';
  else midDesc = '生活对你并不温柔，你一直在用有限的筹码，与命运进行着艰难的博弈。';

  const epitaphs = [
    "人生如逆旅，我亦是行人。",
    "他/她曾真实地活过，爱过，挣扎过。",
    "没有白走的路，每一步都算数。",
    "这一生，虽有遗憾，但绝不后悔。",
    "愿下个剧本里，你能得偿所愿。"
  ];
  const epitaph = epitaphs[Math.floor(Math.random() * epitaphs.length)];

  return `
    <div class="persona-box">
      <div class="avatar-wrapper ${scoreClass}">
        ${crown}
        <div class="avatar-circle" style="background: ${bgGradient || 'rgba(255,255,255,0.1)'}">
          <span style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); transform: translateY(2px)">${baseAvatar}</span>
        </div>
        ${accTag ? `<div class="avatar-accessory acc-tag">${accTag}</div>` : ''}
        ${accPain}
      </div>

      <div class="persona-tags">${tagHTML}</div>
      <div class="persona-text">
        ${highDesc}<br>${lowDesc}<br>${midDesc}
      </div>
      <div class="persona-epitaph">“ ${epitaph} ”</div>
    </div>
  `;
}

function attrComment(k, v) {
  const bands = {
    health:    ['身体已经严重透支', '健康是个隐患', '状态尚可', '身体硬朗，老当益壮'],
    wealth:    ['财务相当紧张', '现金流偏紧', '财务稳健', '实现了真正的财务自由'],
    happiness: ['很少感到真正的快乐', '情绪起伏比较大', '整体还算知足', '内心丰盈安定，活得通透'],
    relations: ['身边几乎没有人可依靠', '关系比较疏离', '有几个能说真话的人', '被爱包围，拥有高质量的人脉'],
    growth:    ['几乎停止了成长', '成长比较有限', '还在慢慢进步', '终身学习，一直在拓展边界'],
  };
  const idx = v >= 75 ? 3 : v >= 50 ? 2 : v >= 25 ? 1 : 0;
  return bands[k][idx];
}

function radarSVG(attrs) {
  const cx = 150, cy = 150, R = 92;
  const n = 5;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [ +(cx + Math.cos(ang(i)) * r).toFixed(1), +(cy + Math.sin(ang(i)) * r).toFixed(1) ];

  let rings = '';
  for (let lv = 1; lv <= 4; lv++) {
    const pts = Array.from({ length: n }, (_, i) => pt(i, R * lv / 4).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.07)" />`;
  }

  let axes = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.09)" />`;
  }

  const dataPts = ATTR_KEYS.map((k, i) => pt(i, R * attrs[k] / 100));
  const poly = dataPts.map(p => p.join(',')).join(' ');

  let labels = '';
  ATTR_KEYS.forEach((k, i) => {
    const m = ATTR_META[k];
    const [lx, ly] = pt(i, R + 24);
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="${m.color}">${m.name}</text>`;
    const [vx, vy] = pt(i, R + 40);
    labels += `<text x="${vx}" y="${vy}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="rgba(255,255,255,0.4)">${Math.round(attrs[k])}</text>`;
  });

  const dots = dataPts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" />`).join('');

  return `
    <svg viewBox="0 0 300 310" class="radar">
      ${rings}${axes}
      <polygon points="${poly}" fill="rgba(109,140,255,0.26)" stroke="#6d8cff" stroke-width="2" stroke-linejoin="round" />
      ${dots}${labels}
    </svg>`;
}

function showEnd() {
  S.finalScore = calcScore();
  const rank = getRank(S.finalScore);
  S.finalRank = rank.name;
  const attrs = S.attrs;

  const reviewHTML = S.history.map(h => {
    const dHTML = ATTR_KEYS
      .filter(k => h.deltas[k] !== 0)
      .map(k => {
        const d = h.deltas[k], m = ATTR_META[k];
        return `<span class="delta ${d > 0 ? 'up' : 'down'}">${m.icon} ${d > 0 ? '+' : ''}${d}</span>`;
      }).join('');
    return `
      <div class="review-item">
        <div class="review-head">
          <span class="review-age">${h.age} 岁</span>
          <span class="review-title">${h.title}</span>
        </div>
        <div class="review-choice">${h.choice}</div>
        <div class="review-deltas">${dHTML}</div>
      </div>`;
  }).join('');

  const n = S.history.length;
  const picks = [0, Math.floor(n / 2), n - 1].filter((v, i, arr) => arr.indexOf(v) === i);
  const altHTML = picks.map(pi => {
    const h = S.history[pi];
    const ev = EVENTS[h.evIndex];
    const alts = ev.choices.filter((_, i) => i !== h.choiceIndex);
    if (!alts.length) return '';
    const alt = alts[0];
    const likely = alt.outcomes.reduce((a, b) => (a.p >= b.p ? a : b));
    return `
      <div class="alt-item">
        <div class="alt-head">${h.age} 岁 · ${h.title}</div>
        <div class="alt-path">另一条路：${alt.title}</div>
        <div class="alt-text">最可能发生：${likely.t}</div>
      </div>`;
  }).join('');

  const attrRowsHTML = ATTR_KEYS.map(k => {
    const m = ATTR_META[k], v = Math.round(attrs[k]);
    return `
      <div class="attr-row">
        <div class="ar-icon">${m.icon}</div>
        <div class="ar-body">
          <div class="ar-top">
            <span class="ar-name">${m.name}</span>
            <span class="ar-val" style="color:${m.color}">${v}</span>
          </div>
          <div class="ar-bar"><i style="width:${v}%;background:${m.color}"></i></div>
          <div class="ar-comment">${attrComment(k, v)}</div>
        </div>
      </div>`;
  }).join('');

  const lifespan = S.history.length ? S.history[S.history.length - 1].age : 0;
  const gIcon = S.gender === 'male' ? '👨 男性剧本' : '👩 女性剧本';

  $('end-content').innerHTML = `
    <div class="end-head">
      <div class="end-label">${gIcon} · 人 生 推 演 报 告</div>
      <div class="score">${S.finalScore}<span class="score-unit">分</span></div>
      <div class="rank-name">${S.finalRank}</div>
      <div class="rank-desc">${rank.desc}</div>
      <div class="lifespan-tag">推演跨度 · 18 岁 → ${lifespan} 岁</div>
    </div>

    <div class="panel">
      <div class="panel-title">人 物 画 像</div>
      ${generatePersona(attrs, S.finalScore)}
    </div>

    <div class="panel">
      <div class="panel-title">人 生 面 貌</div>
      <div class="radar-wrap">${radarSVG(attrs)}</div>
    </div>

    <div class="panel">
      <div class="panel-title">分 项 解 读</div>
      <div class="attr-rows">${attrRowsHTML}</div>
    </div>

    <div class="panel">
      <div class="panel-title">关 键 决 策 回 放</div>
      <div class="review-list">${reviewHTML}</div>
    </div>

    <div class="panel">
      <div class="panel-title">如 果 当 初</div>
      ${altHTML}
    </div>

    <div class="end-actions">
      <button class="btn-primary" id="share-btn">分享结果</button>
      <button class="btn-secondary" id="restart-btn">换个活法</button>
    </div>
  `;

  showScreen('screen-end');

  $('share-btn').addEventListener('click', shareResult);
  $('restart-btn').addEventListener('click', () => showScreen('screen-start'));
}

function shareResult() {
  // 使用全局配置的固定链接
  const url = SHARE_URL;
  const text = `我在《人生沙盘》里推演了一生！\n最终得分：${S.finalScore}分\n获得称号：【${S.finalRank}】\n人物画像：${S.tags}\n\n如果人生可以重来，你会怎么选？\n快来测测你的平行宇宙：`;

  if (navigator.share) {
    navigator.share({ title: '人生沙盘 · 推演模拟器', text: text, url: url }).catch(() => copyText(text + ' ' + url));
  } else {
    copyText(text + ' ' + url);
  }
}

function copyText(str) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(str).then(() => showToast('文案已复制，快发朋友圈吧！')).catch(() => fallbackCopy(str));
  } else { fallbackCopy(str); }
}

function fallbackCopy(str) {
  const textArea = document.createElement("textarea");
  textArea.value = str;
  textArea.style.position = "fixed"; textArea.style.left = "-9999px";
  document.body.appendChild(textArea);
  textArea.focus(); textArea.select();
  try { document.execCommand('copy'); showToast('文案已复制，快发朋友圈吧！'); }
  catch (err) { showToast('复制失败，请手动截图'); }
  document.body.removeChild(textArea);
}

$('btn-start').addEventListener('click', () => { showScreen('screen-gender'); });
</script>
